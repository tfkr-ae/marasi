name: Release

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]'
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]-*'

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          git fetch origin "$default_branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag ${GITHUB_REF_NAME} is not on ${default_branch}"
            exit 1
          fi

  test:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -v -race ./...

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make linux-amd64 windows-amd64 VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: unix-windows
          path: |
            dist/marasi-linux-amd64
            dist/marasi-windows-amd64.exe

  build-darwin:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make darwin-arm64 VERSION="$GITHUB_REF_NAME"
      - uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_CERT }}
          p12-password: ${{ secrets.MACOS_DEVELOPER_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_DEVELOPER_CERT_PASSWORD }}
      - name: Sign and notarize
        env:
          MACOS_DEVELOPER_CERT_ID: ${{ secrets.MACOS_DEVELOPER_CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          binary=dist/marasi-darwin-arm64
          codesign --force --options runtime --timestamp --sign "$MACOS_DEVELOPER_CERT_ID" "$binary"
          codesign --verify --verbose "$binary"
          team_id="${MACOS_DEVELOPER_CERT_ID##*(}"
          team_id="${team_id%)}"
          zip_path="${binary}.zip"
          ditto -c -k "$binary" "$zip_path"
          xcrun notarytool submit "$zip_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$team_id" \
            --wait
          rm -f "$zip_path"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/marasi-darwin-arm64

  publish:
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum marasi-linux-amd64 marasi-darwin-arm64 marasi-windows-amd64.exe > checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --latest \
            dist/marasi-linux-amd64 \
            dist/marasi-darwin-arm64 \
            dist/marasi-windows-amd64.exe \
            dist/checksums.txt
