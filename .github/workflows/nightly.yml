name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      previous: ${{ steps.check.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ ! -d cmd/marasi ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'No cmd/marasi on this ref, skipping.'
            exit 0
          fi
          commits=$(git rev-list --count --since='24 hours ago' HEAD)
          if [ "$commits" -eq 0 ] && [ "$EVENT_NAME" != workflow_dispatch ]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          # The commit the published nightly was built from, read before its
          # tag moves; the new nightly's notes list the commits since it.
          # Empty for the first nightly.
          previous=$(git rev-parse -q --verify 'refs/tags/nightly^{commit}' || true)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          date_utc=$(date -u '+%d.%m.%Y')
          {
            echo 'version<<EOF'
            echo "${date_utc} (nightly ${GITHUB_SHA:0:7})"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -v -race -timeout 20m ./...

  build-linux:
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: nightly
          # The public half of the Marasi signing key (ADR-0048), the base64
          # line of minisign.pub. Installed builds verify updates against it.
          SIGNING_PUBLIC_KEY: ${{ vars.MARASI_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$SIGNING_PUBLIC_KEY" ]; then
            echo "::error::repository variable MARASI_SIGNING_PUBLIC_KEY is not set"
            exit 1
          fi
          make linux-amd64 windows-amd64 VERSION="$VERSION" CHANNEL="$CHANNEL" SIGNING_PUBLIC_KEY="$SIGNING_PUBLIC_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: unix-windows
          path: |
            dist/marasi-linux-amd64
            dist/marasi-windows-amd64.exe

  build-darwin:
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: nightly
          # The public half of the Marasi signing key (ADR-0048), the base64
          # line of minisign.pub. Installed builds verify updates against it.
          SIGNING_PUBLIC_KEY: ${{ vars.MARASI_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$SIGNING_PUBLIC_KEY" ]; then
            echo "::error::repository variable MARASI_SIGNING_PUBLIC_KEY is not set"
            exit 1
          fi
          make darwin-arm64 VERSION="$VERSION" CHANNEL="$CHANNEL" SIGNING_PUBLIC_KEY="$SIGNING_PUBLIC_KEY"
      - uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_DEVELOPER_CERT }}
          p12-password: ${{ secrets.MACOS_DEVELOPER_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_DEVELOPER_CERT_PASSWORD }}
      - name: Sign and notarize
        env:
          MACOS_DEVELOPER_CERT_ID: ${{ secrets.MACOS_DEVELOPER_CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          binary=dist/marasi-darwin-arm64
          codesign --force --options runtime --timestamp --sign "$MACOS_DEVELOPER_CERT_ID" "$binary"
          codesign --verify --verbose "$binary"
          team_id="${MACOS_DEVELOPER_CERT_ID##*(}"
          team_id="${team_id%)}"
          zip_path="${binary}.zip"
          ditto -c -k "$binary" "$zip_path"
          keychain="$HOME/Library/Keychains/signing_temp.keychain-db"
          xcrun notarytool store-credentials marasi-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$team_id" \
            --keychain "$keychain"
          xcrun notarytool submit "$zip_path" \
            --keychain-profile marasi-notary \
            --keychain "$keychain" \
            --wait
          rm -f "$zip_path"
      - uses: actions/upload-artifact@v4
        with:
          name: darwin
          path: dist/marasi-darwin-arm64

  publish:
    needs: [prepare, build-linux, build-darwin]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum marasi-linux-amd64 marasi-darwin-arm64 marasi-windows-amd64.exe > checksums.txt
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Sign checksums
        working-directory: dist
        env:
          SIGNING_KEY: ${{ secrets.MARASI_SIGNING_KEY }}
          SIGNING_PUBLIC_KEY: ${{ vars.MARASI_SIGNING_PUBLIC_KEY }}
          CHANNEL: nightly
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::repository secret MARASI_SIGNING_KEY is not set"
            exit 1
          fi
          if [ -z "$SIGNING_PUBLIC_KEY" ]; then
            echo "::error::repository variable MARASI_SIGNING_PUBLIC_KEY is not set"
            exit 1
          fi
          go install aead.dev/minisign/cmd/minisign@v0.3.0
          key_file="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key_file")
          "$(go env GOPATH)/bin/minisign" -S -s "$key_file" -m checksums.txt \
            -t "marasi $CHANNEL $VERSION"
          # Fails the job if the secret and the key built into Marasi differ.
          "$(go env GOPATH)/bin/minisign" -V -H -P "$SIGNING_PUBLIC_KEY" -m checksums.txt
      - name: Move nightly tag
        run: |
          git tag -f nightly
          git push origin nightly --force
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          # The previous nightly's commit, read before its tag moved; empty
          # for the first nightly.
          PREVIOUS: ${{ needs.prepare.outputs.previous }}
          # Marasi reads the nightly's date from its title (its version
          # string) and its commit from the Commit line of its notes; it
          # shows the commit subjects above that line as the notes.
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # The commits since the previous nightly, newest first. Without a
          # previous nightly, when it is this same commit (a forced rebuild),
          # or when its commit is not an ancestor (history rewritten, or a
          # build of another branch), the 20 most recent.
          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$PREVIOUS" "$GITHUB_SHA" 2>/dev/null; then
            range="$PREVIOUS..$GITHUB_SHA"
            limit=100
            total=$(git rev-list --no-merges --count "$range")
          else
            range="$GITHUB_SHA"
            limit=20
            total=0
          fi
          subjects=$(git log --no-merges --format='- %s' -n "$limit" "$range")
          if [ "$total" -gt "$limit" ]; then
            subjects=$(printf '%s\n- …and %d more' "$subjects" "$((total - limit))")
          fi
          if [ -n "$subjects" ]; then
            notes=$(printf '%s\n\nRef: %s\nCommit: %s\n' "$subjects" "$GITHUB_REF_NAME" "$GITHUB_SHA")
          else
            notes=$(printf 'Ref: %s\nCommit: %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA")
          fi
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          gh release create nightly \
            --verify-tag \
            --title "$VERSION" \
            --prerelease \
            --latest=false \
            --notes "$notes" \
            dist/marasi-linux-amd64 \
            dist/marasi-darwin-arm64 \
            dist/marasi-windows-amd64.exe \
            dist/checksums.txt \
            dist/checksums.txt.minisig
