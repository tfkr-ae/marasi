name: Autobahn

# See "Autobahn checks" in README.md.
on:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    paths:
      - 'websocket/**'
      - 'websocket*.go'
      - 'internal/autobahn/**'
      # A relay waits on the database writer's queue, so a slower writer can fail a case.
      - 'db/**'
      - 'proxy.go'
      # The matrix runs these: WebSocket modifiers, Checkpoint holds, extensions.
      - 'modifiers.go'
      - 'checkpoint.go'
      - 'extensions/**'
      - '.github/workflows/autobahn.yml'
      - '.github/scripts/autobahn-monitor.sh'
  workflow_dispatch:

# A new push to the same PR cancels the run still going on the old head.
concurrency:
  group: autobahn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with autobahn.Image in internal/autobahn/harness.go.
  AUTOBAHN_IMAGE: crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074

jobs:
  # The gate: every proxied run is compared to the committed direct baseline,
  # and a job fails on any deviation the harness does not allow. Each run and
  # mode is its own job, so they run in parallel and one failure does not
  # stop the others.
  autobahn:
    name: autobahn (${{ matrix.run }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    # Two suites, each ended by the harness's 75-minute -suite-limit, so
    # the harness reports even when both hang.
    timeout-minutes: 165
    strategy:
      fail-fast: false
      matrix:
        run: [proxy, checkpoint-forward, checkpoint-edit, extension]
        mode: [fuzzingclient, fuzzingserver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: docker pull "$AUTOBAHN_IMAGE"
      # VERBOSE streams the Autobahn output into the job log, so a run that
      # stalls or loses its runner still shows how far it got. The resource
      # monitor and the kernel log stream alongside it for the same reason.
      - run: |
          .github/scripts/autobahn-monitor.sh dist/autobahn/monitor.log &
          monitor=$!
          sudo dmesg --follow-new --time-format iso | sed -u 's/^/[kernel] /' &
          trap 'kill $monitor; sudo pkill -x dmesg' EXIT
          make autobahn RUNS=${{ matrix.run }} MODES=${{ matrix.mode }} VERBOSE=1
      - name: Kernel and memory state
        if: always()
        # Diagnostics only: a missing file or no match must not fail the job.
        shell: bash {0}
        run: |
          free -m
          swapon --show
          grep -H . /proc/pressure/*
          sudo dmesg --time-format iso | grep -iE 'oom|killed process|out of memory|hung task|blocked for more' || echo 'no OOM or hung-task messages'
          docker ps -a
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-${{ matrix.run }}-${{ matrix.mode }}
          path: dist/autobahn/
          if-no-files-found: ignore
