name: Autobahn

on:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    paths:
      - 'websocket/**'
      - 'websocket*.go'
      - 'internal/autobahn/**'
      - '.github/workflows/autobahn.yml'
  workflow_dispatch:

# A new push to the same PR cancels the run still going on the old head.
concurrency:
  group: autobahn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with autobahn.Image in internal/autobahn/harness.go.
  AUTOBAHN_IMAGE: crossbario/autobahn-testsuite@sha256:519915fb568b04c9383f70a1c405ae3ff44ab9e35835b085239c258b6fac3074

jobs:
  # The gate: every proxied run is compared to the committed direct baseline,
  # and a job fails on any deviation the harness does not allow. Each run and
  # mode is its own job, so they run in parallel and one failure does not
  # stop the others.
  autobahn:
    name: autobahn (${{ matrix.run }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        run: [proxy, checkpoint-forward, checkpoint-edit, extension]
        mode: [fuzzingclient, fuzzingserver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: docker pull "$AUTOBAHN_IMAGE"
      # VERBOSE streams the Autobahn output into the job log, so a run that
      # stalls or loses its runner still shows how far it got.
      - run: make autobahn RUNS=${{ matrix.run }} MODES=${{ matrix.mode }} VERBOSE=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autobahn-${{ matrix.run }}-${{ matrix.mode }}
          path: dist/autobahn/
          if-no-files-found: ignore
